<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>РУчеба — учись играя</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>📚 РУчеба</h1>
        <p class="subtitle">Учись играя</p>
    </header>

    <main>
        <!-- Экран приветствия / регистрации -->
        <div id="welcome-screen">
            <div class="welcome-card">
                <h2 class="welcome-title">Привет! 👋</h2>
                <p class="welcome-text">Давай познакомимся — это нужно, чтобы сохранять твой прогресс.</p>

                <label class="form-label">
                    Класс
                    <select id="classSelect" class="form-input">
                        <option value="">— Выбери класс —</option>
                        <option value="1">1 класс</option>
                        <option value="2">2 класс</option>
                        <option value="3">3 класс</option>
                        <option value="4">4 класс</option>
                        <option value="5">5 класс</option>
                        <option value="6">6 класс</option>
                        <option value="7">7 класс</option>
                        <option value="8">8 класс</option>
                        <option value="9">9 класс</option>
                        <option value="10">10 класс</option>
                        <option value="11">11 класс</option>
                    </select>
                </label>

                <label class="form-label">
                    Имя
                    <input type="text" id="firstName" class="form-input" placeholder="Например, Ваня">
                </label>

                <label class="form-label">
                    Фамилия
                    <input type="text" id="lastName" class="form-input" placeholder="Например, Иванов">
                </label>

                <button class="start-btn" id="startBtn">Начать учиться →</button>
                <p class="form-error" id="formError"></p>
            </div>
        </div>

        <!-- Главный экран: предметы -->
        <div id="subjects-screen" style="display: none;">
            <p class="greeting" id="greeting"></p>
            <h2 class="screen-title">Выбери предмет</h2>
            <div class="subjects-grid" id="subjectsGrid"></div>
        </div>

        <!-- Экран заданий по предмету -->
        <div id="tasks-screen" style="display: none;">
            <button class="back-btn" id="backToSubjects">← Назад к предметам</button>
            <h2 class="screen-title" id="subjectTitle"></h2>
            <div class="task-list" id="taskList"></div>
        </div>

        <!-- Экран одного задания -->
        <div id="task-screen" style="display: none;">
            <button class="back-btn" id="backToTasks">← Назад к заданиям</button>
            <div class="task-card" id="task">
                <div class="task-header">
                    <span class="task-number" id="taskNumber">Задание 1</span>
                    <span class="task-subject" id="taskSubject"></span>
                </div>
                <p class="task-question" id="taskQuestion"></p>
                <div class="answers" id="answers"></div>
                <div class="result" id="result"></div>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 РУчеба</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
