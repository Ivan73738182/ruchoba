<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>РУчеба — учись играя</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>📚 РУчеба</h1>
        <p class="subtitle">Учись играя</p>
    </header>

    <main>
        <!-- Экран со списком заданий -->
        <div id="list-screen">
            <h2 class="screen-title">Выбери задание</h2>
            <div class="task-list" id="taskList"></div>
        </div>

        <!-- Экран с заданием -->
        <div id="task-screen" style="display: none;">
            <button class="back-btn" id="backBtn">← Назад к списку</button>
            <div class="task-card" id="task">
                <div class="task-header">
                    <span class="task-number" id="taskNumber">Задание 1</span>
                    <span class="task-subject" id="taskSubject">Математика</span>
                </div>
                <p class="task-question" id="taskQuestion"></p>
                <div class="answers" id="answers"></div>
                <div class="result" id="result"></div>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 РУчеба</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
